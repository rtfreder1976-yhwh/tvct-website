name: Schema & Claim Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  one_time_same_day_cleanup:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 134
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/remove-same-day-promises
          fetch-depth: 0

      - name: Remove same-day availability promises and commit clean source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/one-time-remove-same-day-promises.mjs
          node scripts/validate-claim-drift.mjs
          git checkout origin/main -- .github/workflows/schema-validation.yml
          git rm -f .github/workflows/one-time-same-day-cleanup.yml scripts/one-time-remove-same-day-promises.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/schema-validation.yml
          git diff --cached --quiet && { echo "No cleanup changes were produced"; exit 1; }
          git commit -m "fix: remove same-day availability promises"
          git push origin HEAD:codex/remove-same-day-promises

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Astro type/content check
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee astro-check.log

      - name: Upload Astro check diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: astro-check-diagnostics
          path: astro-check.log
          if-no-files-found: error
          retention-days: 7

      - name: Retired-claim source audit
        run: npm run validate:claims

      - run: npm run build

      - name: Extract and validate JSON-LD schemas
        shell: bash
        run: |
          set -o pipefail
          node - <<'NODE' 2>&1 | tee jsonld-validation.log
          const fs = require('fs');
          const path = require('path');

          function findHtmlFiles(dir) {
            const files = [];
            for (const f of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, f.name);
              if (f.isDirectory()) files.push(...findHtmlFiles(full));
              else if (f.name.endsWith('.html')) files.push(full);
            }
            return files;
          }

          const htmlFiles = findHtmlFiles('dist/client');
          const retiredOfferPrices = new Set(['99', '119', '129', '135', '149', '175', '176', '225', '275', '400']);
          let errors = 0;
          let checked = 0;

          function walk(value, file) {
            if (!value || typeof value !== 'object') return;

            if (value['@type'] === 'Offer' || value['@type'] === 'PriceSpecification') {
              const candidates = [value.price, value.minPrice];
              for (const candidate of candidates) {
                if (candidate !== undefined && retiredOfferPrices.has(String(candidate))) {
                  console.error(`Retired Offer price ${candidate} in ${file}`);
                  errors++;
                }
              }
            }

            for (const child of Object.values(value)) {
              if (Array.isArray(child)) child.forEach((item) => walk(item, file));
              else if (child && typeof child === 'object') walk(child, file);
            }
          }

          for (const file of htmlFiles) {
            const content = fs.readFileSync(file, 'utf8');
            const matches = content.match(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/g) || [];
            for (const match of matches) {
              const json = match
                .replace(/<script type="application\/ld\+json">/, '')
                .replace(/<\/script>/, '');
              try {
                const parsed = JSON.parse(json);
                if (!parsed['@context'] || !parsed['@type']) {
                  console.error('Missing @context or @type in ' + file);
                  errors++;
                }
                walk(parsed, file);
                checked++;
              } catch (e) {
                console.error('Invalid JSON-LD in ' + file + ': ' + e.message);
                errors++;
              }
            }
          }

          console.log(`Checked ${checked} schema blocks across ${htmlFiles.length} pages`);
          if (errors > 0) process.exit(1);
          console.log('All schemas and Offer-price invariants valid');
          NODE

      - name: Upload JSON-LD validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jsonld-validation-diagnostics
          path: jsonld-validation.log
          if-no-files-found: ignore
          retention-days: 7
