name: Lighthouse CI

on:
  pull_request:
    branches: [main]

# This one is not just contents:read — two steps hand GITHUB_TOKEN to actions
# that call the API. wait-for-vercel-preview polls the PR's deployments and
# their statuses until the preview is live, and lighthouse-ci-action uses
# LHCI_GITHUB_APP_TOKEN to report results back onto the commit.
permissions:
  contents: read
  deployments: read
  statuses: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Vercel preview deployment
        id: vercel_preview
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600
          vercel_protection_bypass_header: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Build bypass-suffixed URLs
        id: urls
        env:
          BASE: ${{ steps.vercel_preview.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          # Only audit pages we actually own and can fix. /get-quote used to be
          # the third URL here, but it now 301s to the hosted BookingKoala flow,
          # so Lighthouse followed the redirect off-site and scored their app
          # (performance 0.29, TBT 2248ms) instead of ours. /pricing is the
          # closest remaining high-intent page that we still serve.
          Q="x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          {
            echo "home=$BASE/?$Q"
            echo "house=$BASE/services/house-cleaning?$Q"
            echo "pricing=$BASE/pricing?$Q"
          } >> "$GITHUB_OUTPUT"

      - name: Run Lighthouse CI against preview
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            ${{ steps.urls.outputs.home }}
            ${{ steps.urls.outputs.house }}
            ${{ steps.urls.outputs.pricing }}
          uploadArtifacts: true
          temporaryPublicStorage: false
          configPath: .github/lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
